name: Build ml-metadata with Conda

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d # v1.11.0
      with:
        environment-file: ${{ matrix.os == 'macos-latest' && 'ci/environment-macos.yml' || 'ci/environment.yml' }}
        cache-environment: true
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Display environment info
      shell: bash -l {0}
      run: |
        micromamba info
        micromamba list

    - name: Install Bazel
      shell: bash -l {0}
      run: |
        # Install Bazelisk (manages Bazel versions)
        ARCH="amd64"
        if [ "$(uname -m)" == "arm64" ]; then
          ARCH="arm64"
        fi

        mkdir -p "$HOME/.local/bin"
        if [ "$RUNNER_OS" == "Linux" ]; then
          curl -Lo "$HOME/.local/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-${ARCH}"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          curl -Lo "$HOME/.local/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-darwin-${ARCH}"
        fi
        chmod +x "$HOME/.local/bin/bazel"
        if [ -n "$CONDA_PREFIX" ]; then
          cp "$HOME/.local/bin/bazel" "$CONDA_PREFIX/bin/bazel"
        fi
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "USE_BAZEL_VERSION=7.7.0" >> $GITHUB_ENV
        echo "BAZEL_USE_CPP_ONLY_TOOLCHAIN=1" >> $GITHUB_ENV
        bazel --version

    - name: Install build tooling
      shell: bash -l {0}
      run: |
        python -m pip install --upgrade pip build wheel "setuptools<69.3"

    - name: Build the package
      shell: bash -l {0}
      run: |
        unset APPLE_SDK_VERSION_OVERRIDE XCODE_VERSION_OVERRIDE
        rm -rf build build_mlmd_tmp dist
        python -m build --wheel --no-isolation

    - name: Repair wheel (Linux)
      if: runner.os == 'Linux'
      shell: bash -l {0}
      run: |
        python -m pip install auditwheel
        WHEEL_PATH="$(ls dist/*.whl)"
        auditwheel repair --plat auto -w dist "${WHEEL_PATH}"
        rm "${WHEEL_PATH}"

    - name: Upload wheel artifact
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: ml-metadata-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/ml-metadata/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve wheels
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          merge-multiple: true
          path: wheels

      - name: List the build artifacts
        run: |
          ls -lAs wheels/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="ml-metadata--pypi" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="ml-metadata--pypi" \
                  --quiet
          '

      - name: Upload to PyPI via OSS Exit Gate
        run: |
          python -m pip install --upgrade pip twine
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/ml-metadata--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            wheels/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/ml-metadata/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
